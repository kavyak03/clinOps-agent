name: CI (lint + docker build)

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Disk sanity (before anything heavy) ----
      - name: Show disk space (before cleanup)
        run: df -h

      - name: Free disk space on runner
        run: |
          echo "Cleaning large preinstalled components..."
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      # ---- Python setup ----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -r requirements_api.txt
          pip install --no-cache-dir -r requirements_langchain.txt
          pip install --no-cache-dir -r requirements_openai.txt

      # ---- Sanity check (fast fail if syntax/imports broken) ----
      - name: Compile/import sanity check
        run: |
          python -m compileall -q src scripts app

      # ---- Docker build ----
      - name: Docker build (baked PubMedQA index)
        run: |
          docker build --no-cache -t clinrag:ci .