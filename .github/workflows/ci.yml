name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source
        run: |
          python -m compileall src scripts

      - name: Run smoke eval gate
        run: |
          python -m src.eval.eval_gate --smoke

      - name: Build Docker image
        run: |
          docker build -t clinops-agent:ci .

      - name: Smoke check image metadata
        run: |
          docker image inspect clinops-agent:ci > /tmp/image-inspect.json
          cat /tmp/image-inspect.json | head -c 2000
